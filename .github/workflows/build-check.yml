name: Build Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Download fzt assets from latest release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release download --repo romaine-life/fzt-browser --pattern "fzt.wasm" --pattern "fzt-terminal.js" --pattern "fzt-terminal.css" --pattern "fzt-web.js" --dir frontend

    - name: Build frontend
      working-directory: ./frontend
      run: npm run build
